---
services:
    api:
        container_name: oliverperzyk-bedrock-discord-api
        restart: unless-stopped
        init: true
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_PORT: 3000
        ports:
            - "3000:3000"
        environment:
            NODE_ENV: "${NODE_ENV:-production}"
        env_file:
            - .env
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

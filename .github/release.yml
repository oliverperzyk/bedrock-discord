# Configuration for GitHub's automatically generated release notes.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
---
changelog:
    exclude:
        labels:
            - question
    categories:
        - title: Features
          labels:
              - enhancement
        - title: Bug Fixes
          labels:
              - bug
        - title: Documentation
          labels:
              - documentation
        - title: Dependencies
          labels:
              - deps
              - deps/bun
              - deps/docker
              - deps/docker-compose
              - deps/actions
        - title: Other Changes
          labels:
              - "*"

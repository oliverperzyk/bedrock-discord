# Workflow to deploy applications to GHCR and VPS.
---
name: Deploy applications.
on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
permissions:
    contents: read
    packages: write
defaults:
    run:
        shell: bash
env:
    REGISTRY: ghcr.io
    IMAGE_NAMESPACE: ${{ github.repository }}
jobs:
    build-applications:
        name: Build and push container images.
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                application:
                    - id: docs
                      context: apps/docs
                      dockerfile: apps/docs/Dockerfile
                    - id: api
                      context: apps/api
                      dockerfile: apps/api/Dockerfile
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7

            - name: Skip missing application.
              if: ${{ hashFiles(matrix.application.dockerfile) == '' }}
              run: |
                  echo "No Dockerfile found at '${{ matrix.application.dockerfile }}'."
                  echo "Skipping image build for '${{ matrix.application.id }}'."

            - name: Set up Docker Buildx.
              if: ${{ hashFiles(matrix.application.dockerfile) != '' }}
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry.
              if: ${{ hashFiles(matrix.application.dockerfile) != '' }}
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata.
              if: ${{ hashFiles(matrix.application.dockerfile) != '' }}
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.application.id }}
                  tags: |
                      type=raw,value=latest
                      type=raw,value=${{ github.sha }}

            - name: Build and push Docker image.
              if: ${{ hashFiles(matrix.application.dockerfile) != '' }}
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.application.context }}
                  file: ${{ matrix.application.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
    deploy-applications:
        name: Deploy applications to VPS.
        needs: build-applications
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7

            - name: Deploy over SSH.
              uses: appleboy/ssh-action@v1.2.2
              env:
                  VPS_DEPLOY_PATH: "${{ secrets.VPS_DEPLOY_PATH }}"
                  DOCS_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/docs:${{ github.sha }}
                  API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:${{ github.sha }}
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  envs: DOCS_IMAGE,API_IMAGE,VPS_DEPLOY_PATH
                  script_path: .github/scripts/DeploymentScript.sh

# Workflow to verify the root directory of the repository.
---
name: Verify root directory.
on:
    push:
        paths-ignore:
            - "apps/**"
            - "packages/**"
    pull_request:
        paths-ignore:
            - "apps/**"
            - "packages/**"
permissions:
    contents: read
defaults:
    run:
        shell: bash
jobs:
    verify-root-directory:
        name: Verify root directory.
        runs-on: ubuntu-latest
        env:
            NODE_ENV: test
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7
            - name: Setup Bun.
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install dependencies.
              run: bun install --frozen-lockfile
            - name: Check formatting of all files using Prettier.
              run: bun run format:check
            - name: Check linting of all files using ESLint.
              run: bun run lint
